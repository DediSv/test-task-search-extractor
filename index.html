<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Extractor</title>
</head>
<body>
    <h1>Google Search Extractor</h1>

    <form id="searchForm">
        <input
                type="text"
                id="searchInput"
                placeholder="Type keywords here"
        >
        <button type="submit" id="searchButton">
            Search
        </button>
    </form>

    <button id="downloadButton" style="display: none;">
        Download JSON
    </button>

    <div id="results"></div>

<script src="scripts.js"></script>
</body>
</html>
